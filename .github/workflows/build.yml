
name: Build Windows Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build House Price Predictor
    runs-on: windows-latest

    steps:
      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Setup Python
      # -----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------
      # Upgrade pip
      # -----------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # -----------------------------------------
      # Install dependencies
      # -----------------------------------------
      - name: Install Dependencies
        run: |
          pip install pandas
          pip install numpy
          pip install scikit-learn
          pip install customtkinter
          pip install pyinstaller

      # -----------------------------------------
      # Build Windows executable
      # -----------------------------------------
      - name: Build Application
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "HousePricePredictor" app.py

      # -----------------------------------------
      # Upload EXE as GitHub Actions artifact
      # -----------------------------------------
      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: HousePricePredictor-Windows
          path: dist/HousePricePredictor.exe

