name: Build Windows Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build House Price Predictor
    runs-on: windows-latest

    steps:

      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # Setup Python
      # -----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------
      # Upgrade pip
      # -----------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # -----------------------------------------
      # Install dependencies
      # -----------------------------------------
      - name: Install Dependencies
        run: |
          pip install pandas
          pip install numpy
          pip install scikit-learn
          pip install customtkinter
          pip install pyinstaller


      # -----------------------------------------
      # Check project files
      # -----------------------------------------
      - name: Check Project Files
        run: |
          echo "Repository contents:"
          dir

          echo ""
          echo "Application folder:"
          dir housePricePrediction

          echo ""
          echo "Data folder:"
          dir housePricePrediction\data


      # -----------------------------------------
      # Build Windows EXE
      # -----------------------------------------
      - name: Build Application
        run: |
          cd housePricePrediction

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "HousePricePredictor" `
            --add-data "data\house_dataset.csv;data" `
            app.py


      # -----------------------------------------
      # Check generated EXE
      # -----------------------------------------
      - name: Check Build Output
        run: |
          echo "Build output:"
          dir housePricePrediction\dist

          if (!(Test-Path "housePricePrediction\dist\HousePricePredictor.exe")) {
            Write-Error "EXE was not created!"
            exit 1
          }

          echo "HousePricePredictor.exe created successfully!"


      # -----------------------------------------
      # Upload Windows EXE
      # -----------------------------------------
      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: HousePricePredictor-Windows
          path: housePricePrediction/dist/HousePricePredictor.exe
